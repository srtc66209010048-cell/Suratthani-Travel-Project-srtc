<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Surat Thani Explorer</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .dashboard-container {
            max-width: 1200px;
            width: 100%;
            padding: 20px;
        }
        .dashboard-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
        }
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }
        .admin-header h1 {
            font-size: 28px;
        }
        .admin-header h1 span {
            color: #f5c542;
        }
        .admin-badge {
            background: linear-gradient(135deg, #f5c542, #f59e42);
            color: #1e2a2a;
            padding: 8px 20px;
            border-radius: 50px;
            font-weight: 700;
            font-size: 14px;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-item {
            background: rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: 0.3s;
        }
        .stat-item:hover {
            background: rgba(255, 255, 255, 0.1);
            transform: translateY(-5px);
        }
        .stat-item i {
            font-size: 30px;
            color: #f5c542;
            margin-bottom: 10px;
        }
        .stat-number {
            font-size: 28px;
            font-weight: 700;
        }
        .stat-label {
            font-size: 14px;
            opacity: 0.7;
        }
        .admin-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        .action-btn {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }
        .action-btn:hover {
            background: rgba(245, 197, 66, 0.1);
            border-color: #f5c542;
            transform: translateY(-5px);
        }
        .action-btn i {
            font-size: 28px;
            color: #f5c542;
            margin-bottom: 10px;
            display: block;
        }
        .btn-logout {
            background: rgba(255, 107, 107, 0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255, 107, 107, 0.3);
            padding: 10px 25px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
        }
        .btn-logout:hover {
            background: rgba(255, 107, 107, 0.3);
            transform: scale(1.05);
        }
        .btn-back {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 25px;
            border-radius: 50px;
            cursor: pointer;
            transition: 0.3s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }
        .btn-back:hover {
            background: rgba(255, 255, 255, 0.2);
        }
        .admin-welcome {
            background: rgba(245, 197, 66, 0.1);
            border: 1px solid rgba(245, 197, 66, 0.2);
            padding: 15px 20px;
            border-radius: 15px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .admin-welcome i {
            font-size: 30px;
            color: #f5c542;
        }
        @media (max-width: 768px) {
            .admin-header {
                flex-direction: column;
                align-items: flex-start;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <div class="dashboard-card">
            <!-- Header -->
            <div class="admin-header">
                <div>
                    <h1>👑 <span>Admin</span> Dashboard</h1>
                    <p style="opacity: 0.7; margin-top: 5px;">
                        <i class="fas fa-user-shield"></i> 
                        ยินดีต้อนรับคุณ <strong id="adminName">ผู้ดูแลระบบ</strong>
                    </p>
                </div>
                <div style="display: flex; gap: 10px; flex-wrap: wrap;">
                    <a href="dashboard.html" class="btn-back">
                        <i class="fas fa-arrow-left"></i> กลับหน้าแรก
                    </a>
                    <button class="btn-logout" onclick="logout()">
                        <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
                    </button>
                </div>
            </div>

            <!-- Admin Welcome -->
            <div class="admin-welcome">
                <i class="fas fa-shield-alt"></i>
                <div>
                    <strong>คุณอยู่ในโหมดผู้ดูแลระบบ</strong>
                    <p style="margin: 0; font-size: 14px; opacity: 0.7;">คุณสามารถจัดการข้อมูลทั้งหมดได้</p>
                </div>
            </div>

            <!-- สถิติ -->
            <div class="stats-grid">
                <div class="stat-item">
                    <i class="fas fa-users"></i>
                    <div class="stat-number">1,234</div>
                    <div class="stat-label">ผู้ใช้ทั้งหมด</div>
                </div>
                <div class="stat-item">
                    <i class="fas fa-map-marked-alt"></i>
                    <div class="stat-number">56</div>
                    <div class="stat-label">สถานที่ท่องเที่ยว</div>
                </div>
                <div class="stat-item">
                    <i class="fas fa-star"></i>
                    <div class="stat-number">4.8</div>
                    <div class="stat-label">คะแนนรีวิวเฉลี่ย</div>
                </div>
                <div class="stat-item">
                    <i class="fas fa-calendar-check"></i>
                    <div class="stat-number">89</div>
                    <div class="stat-label">การจองวันนี้</div>
                </div>
            </div>

            <!-- ปุ่มจัดการ -->
            <h3 style="margin-bottom: 15px; color: #f5c542;">
                <i class="fas fa-cogs"></i> จัดการระบบ
            </h3>
            <div class="admin-actions">
                <button class="action-btn" onclick="alert('📌 เปิดหน้าจัดการสถานที่ท่องเที่ยว')">
                    <i class="fas fa-map-pin"></i>
                    จัดการสถานที่
                </button>
                <button class="action-btn" onclick="alert('👥 เปิดหน้าจัดการผู้ใช้')">
                    <i class="fas fa-users-cog"></i>
                    จัดการผู้ใช้
                </button>
                <button class="action-btn" onclick="alert('💬 เปิดหน้าดูรีวิว')">
                    <i class="fas fa-comments"></i>
                    ดูรีวิว
                </button>
                <button class="action-btn" onclick="alert('📊 เปิดหน้ารายงาน')">
                    <i class="fas fa-chart-bar"></i>
                    รายงาน
                </button>
                <button class="action-btn" onclick="alert('⚙️ เปิดหน้าตั้งค่า')">
                    <i class="fas fa-cog"></i>
                    ตั้งค่าระบบ
                </button>
                <button class="action-btn" onclick="alert('💾 สำรองข้อมูลเรียบร้อย')">
                    <i class="fas fa-database"></i>
                    สำรองข้อมูล
                </button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const name = localStorage.getItem('userName') || 'Admin';
            document.getElementById('adminName').textContent = name;
        });
    </script>
</body>
</html>

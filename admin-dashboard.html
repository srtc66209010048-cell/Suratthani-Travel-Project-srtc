<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Surat Thani Travel</title>
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        /* ===== RESET ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Prompt', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: #0b2b2c;
            min-height: 100vh;
            padding: 20px;
        }

        /* ===== HEADER ===== */
        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 30px;
            background: linear-gradient(135deg, #1e6f5c, #0b3b3c);
            border-radius: 20px;
            margin-bottom: 25px;
            flex-wrap: wrap;
            gap: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .admin-header .logo h1 {
            color: #fff;
            font-size: 28px;
            font-weight: 700;
        }

        .admin-header .logo h1 span {
            color: #f5c542;
        }

        .admin-header .logo p {
            color: rgba(255,255,255,0.7);
            font-size: 14px;
        }

        .admin-header .admin-info {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .admin-header .admin-info .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: #f5c542;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #1e2a2a;
            font-weight: 700;
        }

        .admin-header .admin-info .name {
            color: #fff;
        }

        .admin-header .admin-info .name strong {
            display: block;
            font-size: 16px;
        }

        .admin-header .admin-info .name span {
            font-size: 13px;
            opacity: 0.7;
        }

        .btn-logout {
            background: rgba(255,107,107,0.2);
            color: #ff6b6b;
            border: 1px solid rgba(255,107,107,0.3);
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.3s;
            font-weight: 600;
            font-size: 14px;
        }

        .btn-logout:hover {
            background: rgba(255,107,107,0.3);
            transform: scale(1.05);
        }

        /* ===== STATS GRID ===== */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 20px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            transition: 0.3s;
            cursor: pointer;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            background: rgba(255,255,255,0.08);
        }

        .stat-card .stat-icon {
            font-size: 30px;
            color: #f5c542;
            margin-bottom: 10px;
        }

        .stat-card .stat-number {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
        }

        .stat-card .stat-label {
            font-size: 14px;
            opacity: 0.7;
        }

        .stat-card .stat-change {
            font-size: 13px;
            margin-top: 8px;
            display: inline-block;
            padding: 4px 12px;
            border-radius: 20px;
        }

        .stat-change.up {
            background: rgba(46,213,115,0.2);
            color: #2ed573;
        }

        .stat-change.down {
            background: rgba(255,107,107,0.2);
            color: #ff6b6b;
        }

        /* ===== CONTENT CARD ===== */
        .content-card {
            background: rgba(255,255,255,0.05);
            backdrop-filter: blur(10px);
            padding: 25px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.08);
            color: #fff;
            margin-bottom: 25px;
        }

        .content-card .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .content-card .card-header h3 {
            font-size: 18px;
            font-weight: 600;
        }

        .content-card .card-header h3 i {
            color: #f5c542;
            margin-right: 10px;
        }

        /* ===== TABLE ===== */
        .table-wrapper {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        table thead th {
            text-align: left;
            padding: 12px 15px;
            background: rgba(255,255,255,0.05);
            border-bottom: 2px solid rgba(255,255,255,0.1);
            color: #f5c542;
            font-weight: 600;
            white-space: nowrap;
        }

        table tbody td {
            padding: 12px 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
            vertical-align: middle;
        }

        table tbody tr:hover {
            background: rgba(255,255,255,0.03);
        }

        table tbody td .avatar-sm {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            object-fit: cover;
        }

        .badge-user {
            background: rgba(46,213,115,0.2);
            color: #2ed573;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .badge-admin {
            background: rgba(245,197,66,0.2);
            color: #f5c542;
            padding: 3px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
        }

        .btn-delete {
            background: rgba(255,107,107,0.15);
            color: #ff6b6b;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
        }

        .btn-delete:hover {
            background: rgba(255,107,107,0.3);
            transform: scale(1.05);
        }

        .btn-edit {
            background: rgba(245,197,66,0.15);
            color: #f5c542;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
            margin-right: 5px;
        }

        .btn-edit:hover {
            background: rgba(245,197,66,0.3);
            transform: scale(1.05);
        }

        /* ===== ปุ่มรีเซ็ตรหัสผ่าน (เพิ่มใหม่) ===== */
        .btn-reset {
            background: rgba(52, 152, 219, 0.15);
            color: #3498db;
            border: none;
            padding: 6px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 13px;
            margin-right: 5px;
        }

        .btn-reset:hover {
            background: rgba(52, 152, 219, 0.3);
            transform: scale(1.05);
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: rgba(255,255,255,0.5);
        }

        .empty-state i {
            font-size: 50px;
            margin-bottom: 15px;
            opacity: 0.3;
        }

        /* ===== SEARCH ===== */
        .search-box {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .search-box input {
            padding: 10px 18px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05);
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: 0.3s;
            min-width: 250px;
        }

        .search-box input::placeholder {
            color: rgba(255,255,255,0.3);
        }

        .search-box input:focus {
            border-color: #f5c542;
            background: rgba(255,255,255,0.08);
        }

        /* ===== ADMIN ACTIONS ===== */
        .admin-actions {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .action-btn {
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: #fff;
            padding: 20px;
            border-radius: 15px;
            cursor: pointer;
            transition: 0.3s;
            text-align: center;
        }

        .action-btn:hover {
            background: rgba(245,197,66,0.1);
            border-color: #f5c542;
            transform: translateY(-5px);
        }

        .action-btn i {
            font-size: 28px;
            color: #f5c542;
            margin-bottom: 10px;
            display: block;
        }

        .action-btn.active {
            background: rgba(245,197,66,0.15);
            border-color: #f5c542;
        }

        /* ===== TOAST ===== */
        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 16px 24px;
            border-radius: 12px;
            color: #fff;
            font-weight: 500;
            z-index: 999;
            animation: slideUp 0.3s ease;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .toast-success {
            background: #2ed573;
        }

        .toast-error {
            background: #ff6b6b;
        }

        @keyframes slideUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 1200px) {
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 768px) {
            .stats-grid {
                grid-template-columns: 1fr 1fr;
            }
            
            .admin-header {
                flex-direction: column;
                text-align: center;
            }
            
            .admin-header .admin-info {
                flex-wrap: wrap;
                justify-content: center;
            }

            .search-box {
                width: 100%;
                flex-wrap: wrap;
            }

            .search-box input {
                min-width: 100%;
            }

            table {
                font-size: 12px;
            }

            table thead th,
            table tbody td {
                padding: 8px 10px;
            }
        }

        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
            
            .admin-header .logo h1 {
                font-size: 22px;
            }

            table thead th,
            table tbody td {
                padding: 6px 8px;
                font-size: 11px;
            }

            .btn-delete,
            .btn-edit,
            .btn-reset {
                padding: 4px 10px;
                font-size: 11px;
            }
        }

        /* ===== SCROLLBAR ===== */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #0b2b2c;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: #1e6f5c;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #2d8f7a;
        }
    </style>
</head>
<body>
    <!-- ===== HEADER ===== -->
    <header class="admin-header">
        <div class="logo">
            <h1>Surat<span>Thani</span> <span style="font-size: 18px; color: #f5c542;">Admin</span></h1>
            <p>ระบบจัดการ Surat Thani Travel</p>
        </div>
        <div class="admin-info">
            <div class="avatar">👑</div>
            <div class="name">
                <strong id="adminName">ผู้ดูแลระบบ</strong>
                <span>Admin</span>
            </div>
            <button class="btn-logout" onclick="logout()">
                <i class="fas fa-sign-out-alt"></i> ออกจากระบบ
            </button>
        </div>
    </header>

    <!-- ===== STATS ===== -->
    <div class="stats-grid">
        <div class="stat-card" onclick="showUsers()">
            <div class="stat-icon"><i class="fas fa-users"></i></div>
            <div class="stat-number" id="totalUsers">0</div>
            <div class="stat-label">ผู้ใช้ทั้งหมด</div>
            <span class="stat-change up"><i class="fas fa-arrow-up"></i> 12%</span>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-map-marked-alt"></i></div>
            <div class="stat-number">56</div>
            <div class="stat-label">สถานที่ท่องเที่ยว</div>
            <span class="stat-change up"><i class="fas fa-arrow-up"></i> 5%</span>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-star"></i></div>
            <div class="stat-number">4.8</div>
            <div class="stat-label">คะแนนรีวิวเฉลี่ย</div>
            <span class="stat-change up"><i class="fas fa-arrow-up"></i> 0.3</span>
        </div>
        <div class="stat-card">
            <div class="stat-icon"><i class="fas fa-calendar-check"></i></div>
            <div class="stat-number">89</div>
            <div class="stat-label">การจอง/ลงทะเบียน</div>
            <span class="stat-change up"><i class="fas fa-arrow-up"></i> 18%</span>
        </div>
    </div>

    <!-- ===== CONTENT ===== -->
    <div id="mainContent">
        <!-- ปุ่มจัดการ -->
        <div class="content-card">
            <div class="card-header">
                <h3><i class="fas fa-cogs"></i> จัดการระบบ</h3>
            </div>
            <div class="admin-actions">
                <button class="action-btn active" onclick="showUsers()">
                    <i class="fas fa-users-cog"></i>
                    จัดการผู้ใช้
                </button>
                <button class="action-btn" onclick="showToast('📌 เปิดหน้าจัดการสถานที่ท่องเที่ยว', 'success')">
                    <i class="fas fa-map-pin"></i>
                    จัดการสถานที่
                </button>
                <button class="action-btn" onclick="showToast('📊 เปิดหน้ารายงาน', 'success')">
                    <i class="fas fa-chart-bar"></i>
                    รายงาน
                </button>
                <button class="action-btn" onclick="showToast('⚙️ เปิดหน้าตั้งค่า', 'success')">
                    <i class="fas fa-cog"></i>
                    ตั้งค่าระบบ
                </button>
            </div>
        </div>

        <!-- ตารางผู้ใช้ -->
        <div class="content-card" id="userTableCard">
            <div class="card-header">
                <h3><i class="fas fa-users"></i> รายชื่อผู้ใช้ทั้งหมด</h3>
                <div class="search-box">
                    <input type="text" id="searchUser" placeholder="🔍 ค้นหาชื่อหรืออีเมล..." oninput="filterUsers()">
                    <span style="color: rgba(255,255,255,0.3); font-size: 13px;" id="userCount">0 คน</span>
                </div>
            </div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>รูป</th>
                            <th>ชื่อ</th>
                            <th>อีเมล</th>
                            <th>เบอร์โทร</th>
                            <th>บทบาท</th>
                            <th>วันที่สมัคร</th>
                            <th>จัดการ</th>
                        </tr>
                    </thead>
                    <tbody id="userTableBody">
                        <!-- ถูกสร้างโดย JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // Admin Dashboard - จัดการผู้ใช้
        // ============================================

        // ===== 1. แสดงชื่อ Admin =====
        document.addEventListener('DOMContentLoaded', function() {
            const name = localStorage.getItem('userName') || 'Admin';
            document.getElementById('adminName').textContent = name;
            renderUsers();
        });

        // ===== 2. ดึงข้อมูลผู้ใช้ทั้งหมด =====
        function getUsers() {
            const defaultUsers = {
                'admin@surat.com': {
                    name: 'ผู้ดูแลระบบ',
                    email: 'admin@surat.com',
                    phone: '-',
                    password: 'admin123',
                    role: 'admin',
                    avatar: 'https://ui-avatars.com/api/?name=Admin&background=f5c542&size=128',
                    registeredAt: '2024-01-01T00:00:00.000Z'
                }
            };

            const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '{}');
            const allUsers = { ...defaultUsers, ...registeredUsers };
            return allUsers;
        }

        // ===== 3. แสดงข้อมูลผู้ใช้ในตาราง =====
        function renderUsers() {
            const users = getUsers();
            const tbody = document.getElementById('userTableBody');
            const userCount = document.getElementById('userCount');
            const totalUsers = document.getElementById('totalUsers');
            
            const userArray = Object.values(users);
            const count = userArray.length;
            
            totalUsers.textContent = count;
            userCount.textContent = count + ' คน';

            if (count === 0) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="8">
                            <div class="empty-state">
                                <i class="fas fa-users"></i>
                                <p>ยังไม่มีผู้ใช้ในระบบ</p>
                            </div>
                        </td>
                    </tr>
                `;
                return;
            }

            let html = '';
            userArray.forEach((user, index) => {
                const roleBadge = user.role === 'admin' 
                    ? '<span class="badge-admin"><i class="fas fa-user-shield"></i> Admin</span>'
                    : '<span class="badge-user"><i class="fas fa-user"></i> User</span>';
                
                const date = new Date(user.registeredAt);
                const dateStr = date.toLocaleDateString('th-TH', {
                    year: 'numeric',
                    month: 'short',
                    day: 'numeric'
                });

                html += `
                    <tr>
                        <td>${index + 1}</td>
                        <td>
                            <img src="${user.avatar || 'https://ui-avatars.com/api/?name=' + encodeURIComponent(user.name) + '&background=random&size=128'}" 
                                 alt="${user.name}" 
                                 class="avatar-sm">
                        </td>
                        <td><strong>${user.name}</strong></td>
                        <td>${user.email}</td>
                        <td>${user.phone || '-'}</td>
                        <td>${roleBadge}</td>
                        <td style="font-size: 12px; opacity: 0.7;">${dateStr}</td>
                        <td>
                            ${user.role !== 'admin' ? `
                                <button class="btn-edit" onclick="editUser('${user.email}')" title="แก้ไขชื่อ">
                                    <i class="fas fa-edit"></i>
                                </button>
                                <button class="btn-reset" onclick="resetPassword('${user.email}')" title="รีเซ็ตรหัสผ่าน">
                                    <i class="fas fa-key"></i>
                                </button>
                                <button class="btn-delete" onclick="deleteUser('${user.email}')" title="ลบผู้ใช้">
                                    <i class="fas fa-trash"></i>
                                </button>
                            ` : `
                                <span style="opacity: 0.3; font-size: 12px;">ไม่สามารถจัดการได้</span>
                            `}
                        </td>
                    </tr>
                `;
            });

            tbody.innerHTML = html;
        }

        // ===== 4. ค้นหาผู้ใช้ =====
        function filterUsers() {
            const keyword = document.getElementById('searchUser').value.toLowerCase().trim();
            const rows = document.querySelectorAll('#userTableBody tr');
            
            rows.forEach(row => {
                const text = row.textContent.toLowerCase();
                if (text.includes(keyword)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        // ===== 5. ลบผู้ใช้ =====
        function deleteUser(email) {
            if (email === 'admin@surat.com') {
                showToast('❌ ไม่สามารถลบผู้ดูแลระบบหลักได้', 'error');
                return;
            }

            if (confirm(`คุณต้องการลบผู้ใช้ "${email}" ใช่หรือไม่?`)) {
                const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '{}');
                delete registeredUsers[email];
                localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));
                renderUsers();
                showToast(`✅ ลบผู้ใช้ "${email}" สำเร็จ`, 'success');
            }
        }

        // ===== 6. แก้ไขชื่อผู้ใช้ =====
        function editUser(email) {
            const users = getUsers();
            const user = users[email];
            if (!user) {
                showToast('❌ ไม่พบผู้ใช้', 'error');
                return;
            }

            const newName = prompt('✏️ แก้ไขชื่อผู้ใช้:', user.name);
            if (newName && newName.trim()) {
                user.name = newName.trim();
                
                const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '{}');
                if (registeredUsers[email]) {
                    registeredUsers[email].name = newName.trim();
                    localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));
                    renderUsers();
                    showToast(`✅ อัปเดตชื่อผู้ใช้สำเร็จ`, 'success');
                }
            }
        }

        // ===== 7. รีเซ็ตรหัสผ่านผู้ใช้ (เพิ่มใหม่) =====
        function resetPassword(email) {
            if (email === 'admin@surat.com') {
                showToast('❌ ไม่สามารถรีเซ็ตรหัสผ่านผู้ดูแลระบบหลักได้', 'error');
                return;
            }

            const users = getUsers();
            if (!users[email]) {
                showToast('❌ ไม่พบผู้ใช้', 'error');
                return;
            }

            const newPassword = prompt(
                `🔑 รีเซ็ตรหัสผ่านสำหรับ "${email}"\n\n` +
                `กรอกรหัสผ่านใหม่ (อย่างน้อย 6 ตัวอักษร):`
            );

            if (newPassword === null) {
                showToast('❌ ยกเลิกการรีเซ็ตรหัสผ่าน', 'error');
                return;
            }

            if (newPassword.trim().length < 6) {
                showToast('❌ รหัสผ่านต้องมีความยาวอย่างน้อย 6 ตัวอักษร', 'error');
                return;
            }

            if (newPassword.trim() === '') {
                showToast('❌ กรุณากรอกรหัสผ่าน', 'error');
                return;
            }

            if (!confirm(`⚠️ คุณแน่ใจว่าจะรีเซ็ตรหัสผ่านของ "${email}" ใช่หรือไม่?`)) {
                showToast('❌ ยกเลิกการรีเซ็ตรหัสผ่าน', 'error');
                return;
            }

            const registeredUsers = JSON.parse(localStorage.getItem('registeredUsers') || '{}');
            
            if (registeredUsers[email]) {
                registeredUsers[email].password = newPassword.trim();
                localStorage.setItem('registeredUsers', JSON.stringify(registeredUsers));
                renderUsers();
                showToast(`✅ รีเซ็ตรหัสผ่านสำหรับ "${email}" สำเร็จ!`, 'success');
            } else {
                showToast('❌ ไม่พบผู้ใช้ในระบบ', 'error');
            }
        }

        // ===== 8. แสดง Toast =====
        function showToast(message, type = 'success') {
            const oldToast = document.querySelector('.toast');
            if (oldToast) oldToast.remove();

            const toast = document.createElement('div');
            toast.className = `toast toast-${type}`;
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // ===== 9. แสดงหน้าการจัดการผู้ใช้ =====
        function showUsers() {
            document.querySelectorAll('.action-btn').forEach(btn => btn.classList.remove('active'));
            event.target.closest('.action-btn').classList.add('active');
            document.getElementById('userTableCard').style.display = 'block';
            renderUsers();
        }

        // ===== 10. ฟังก์ชัน Logout =====
        function logout() {
            if (confirm('คุณต้องการออกจากระบบใช่หรือไม่?')) {
                localStorage.removeItem('isLoggedIn');
                localStorage.removeItem('userEmail');
                localStorage.removeItem('userRole');
                localStorage.removeItem('userName');
                localStorage.removeItem('loginTime');
                window.location.href = 'index.html';
            }
        }

        console.log('✅ Admin Dashboard พร้อมทำงาน!');
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Surat Thani Explorer</title>
    
    <!-- เชื่อมต่อ CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Font Awesome (ไอคอน) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <!-- ส่วนหัว -->
            <div class="brand">
                <img src="assets/images/logo.png" alt="Surat Thani Logo" class="logo" 
                     onerror="this.src='https://via.placeholder.com/80x80?text=🏝️'">
                <h1>Surat Thani <span>Explorer</span></h1>
                <p>เข้าสู่ระบบเพื่อวางแผนเที่ยว</p>
            </div>

            <!-- ฟอร์ม Login -->
            <form id="loginForm">
                <div class="input-group">
                    <i class="fas fa-envelope"></i>
                    <input type="email" id="email" placeholder="อีเมลของคุณ" required>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="รหัสผ่าน" required>
                    <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                </div>

                <div class="options">
                    <label>
                        <input type="checkbox"> จดจำฉัน
                    </label>
                    <a href="#">ลืมรหัสผ่าน?</a>
                </div>

                <button type="submit" class="btn-login">เข้าสู่ระบบ</button>

                <div class="signup-link">
                    ยังไม่มีบัญชี? <a href="#">สมัครสมาชิก</a>
                </div>
            </form>

            <!-- ข้อความ error -->
            <div id="errorMessage" class="error-message"></div>

            <!-- ปุ่ม GitHub -->
            <div class="github-section">
                <hr>
                <p>หรือเข้าสู่ระบบด้วย</p>
                <button class="btn-github" id="githubLogin">
                    <i class="fab fa-github"></i> GitHub
                </button>
            </div>
        </div>
    </div>

    <!-- เชื่อมต่อ JavaScript -->
    <script src="script.js"></script>
</body>
</html>

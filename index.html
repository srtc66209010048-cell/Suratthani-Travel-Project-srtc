<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>เข้าสู่ระบบ - Surat Thani Travel</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-wrapper">
        <div class="login-container">
            <!-- ด้านซ้าย - รูปภาพพื้นหลัง -->
            <div class="login-image" style="background-image: url('https://images.unsplash.com/photo-1589391876645-5b8ff5d9c00b?w=800'); background-size: cover; background-position: center; background-repeat: no-repeat;">
                <div class="image-overlay">
                    <div class="image-content">
                        <div class="brand-text">
                            <h1>Surat<span>Thani</span></h1>
                            <h2>Travel</h2>
                            <p>เที่ยวสุราษฎร์ธานี ครบทุกเส้นทาง</p>
                            <p class="sub-text">ประสบการณ์ที่คุณไม่ควรพลาด</p>
                        </div>
                    </div>
                </div>
            </div>

            <!-- ด้านขวา - ฟอร์ม Login -->
            <div class="login-form">
                <div class="form-header">
                    <h1>Welcome Back!</h1>
                    <p>เข้าสู่ระบบเพื่อเริ่มวางแผนการเดินทาง</p>
                </div>

                <!-- ฟอร์ม -->
                <form id="loginForm">
                    <!-- ช่องอีเมล -->
                    <div class="input-group">
                        <label for="email">
                            <i class="fas fa-envelope"></i> อีเมล
                        </label>
                        <input type="email" id="email" placeholder="กรอกอีเมลของคุณ" required>
                    </div>

                    <!-- ช่องรหัสผ่าน -->
                    <div class="input-group">
                        <label for="password">
                            <i class="fas fa-lock"></i> รหัสผ่าน
                        </label>
                        <div class="password-wrapper">
                            <input type="password" id="password" placeholder="กรอกรหัสผ่านของคุณ" required>
                            <i class="fas fa-eye toggle-password" id="togglePassword"></i>
                        </div>
                    </div>

                    <!-- ✅ แก้ไขแล้ว: จดจำฉัน + ลืมรหัสผ่าน อยู่ในบรรทัดเดียวกัน -->
                    <div class="form-options">
                        <label class="checkbox-label">
                            <input type="checkbox" id="rememberMe">
                            <span class="checkmark"></span>
                            จดจำฉัน
                        </label>
                        <a href="#" class="forgot-link" onclick="alert('กรุณาติดต่อผู้ดูแลระบบ')">ลืมรหัสผ่าน?</a>
                    </div>

                    <!-- ปุ่ม Login -->
                    <button type="submit" class="btn-login">
                        <i class="fas fa-sign-in-alt"></i> เข้าสู่ระบบ
                    </button>

                    <!-- ตัวแบ่ง -->
                    <div class="divider">
                        <span>หรือเข้าสู่ระบบด้วย</span>
                    </div>

                    <!-- ✅ แก้ไขแล้ว: ปุ่ม Social อยู่ในบรรทัดเดียวกัน -->
                    <div class="social-buttons">
                        <button type="button" class="btn-social btn-google" id="googleLogin">
                            <i class="fab fa-google"></i> Google
                        </button>
                        <button type="button" class="btn-social btn-facebook" id="facebookLogin">
                            <i class="fab fa-facebook-f"></i> Facebook
                        </button>
                    </div>

                    <!-- ลิงก์สมัครสมาชิก -->
                    <div class="signup-link">
                        ยังไม่มีบัญชี? <a href="#" onclick="alert('ฟังก์ชันสมัครสมาชิกกำลังพัฒนา')">สมัครสมาชิก</a>
                    </div>
                </form>

                <!-- ข้อความ error -->
                <div id="errorMessage" class="error-message"></div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
